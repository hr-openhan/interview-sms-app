<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>면접 문자 발송</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="mark">01</div>
      <div class="title-block">
        <h1>면접 문자 발송</h1>
      </div>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="send">문자 보내기</button>
        <button class="tab-btn" data-tab="manage">양식 관리</button>
      </nav>
    </header>

    <div id="sendView">
    <main class="grid">
      <section class="panel form-panel">
        <div class="field">
          <label for="name">지원자 이름</label>
          <input id="name" type="text" placeholder="예: 오픈한" autocomplete="off" />
        </div>

        <div class="field">
          <label for="phone">연락처</label>
          <input id="phone" type="tel" placeholder="예: 010-1234-5678" autocomplete="off" />
        </div>

        <div class="field">
          <label for="template">문자 양식</label>
          <select id="template">
            <option value="">양식을 선택하세요</option>
          </select>
        </div>

        <div class="field" id="dateField" hidden>
          <label for="date">면접 일정 / 세부 내용</label>
          <textarea id="date" rows="3" placeholder="예: 9월 12일 (금) 오후 2시"></textarea>
        </div>

        <div class="field">
          <label for="memo">메모</label>
          <input id="memo" type="text" autocomplete="off" />
          <p class="hint">문자 발송에 포함되지 않는 내용입니다.</p>
        </div>

        <button id="sendBtn" class="send-btn" disabled>문자 보내기</button>
        <p class="status" id="status"></p>
      </section>

      <section class="panel preview-panel">
        <div class="preview-head">
          <span class="preview-label">미리보기 (직접 수정 가능)</span>
          <span class="preview-count" id="charCount">0자</span>
        </div>
        <textarea id="previewText" class="preview-text" rows="12">왼쪽에서 이름과 양식을 선택하면 실제 발송될 문자 내용이 여기에 표시됩니다.</textarea>
        <button id="previewResetBtn" class="link-btn" hidden>자동 생성 내용으로 되돌리기</button>
      </section>
    </main>

    <section class="panel history-panel">
      <div class="preview-head">
        <span class="preview-label">발송 이력</span>
        <div class="sort-toggle">
          <button class="sort-btn active" data-sort="date">날짜순</button>
          <button class="sort-btn" data-sort="name">가나다순</button>
        </div>
      </div>

      <div class="history-filters">
        <input id="historySearch" type="text" placeholder="이름 또는 연락처로 검색" autocomplete="off" />
        <select id="historyMonthFilter">
          <option value="">전체 월</option>
        </select>
        <button id="deleteFailedBtn" class="delete-failed-btn">실패 이력만 삭제</button>
      </div>

      <table class="history-table">
        <thead>
          <tr>
            <th>일시</th>
            <th>이름</th>
            <th>연락처</th>
            <th>양식</th>
            <th>면접 제안 일시</th>
            <th>메모</th>
            <th>결과</th>
            <th>참석여부</th>
            <th></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr><td colspan="10" class="empty-row">발송 이력이 아직 없습니다.</td></tr>
        </tbody>
      </table>
    </section>

    <div id="scheduleView" class="schedule-view">
      <section class="panel schedule-form-panel">
        <div class="field-row">
          <div class="field">
            <label for="schName">지원자 이름</label>
            <input id="schName" type="text" placeholder="예: 오픈한" autocomplete="off" />
          </div>
          <div class="field">
            <label for="schPhone">연락처</label>
            <input id="schPhone" type="tel" placeholder="예: 010-1234-5678" autocomplete="off" />
          </div>
        </div>
        <div class="field">
          <label>확정 면접 일시</label>
          <div class="datetime-group">
            <select id="schYear"></select>
            <select id="schMonth"></select>
            <select id="schDay"></select>
            <input id="schHour" type="number" min="0" max="23" inputmode="numeric" />
            <span class="datetime-unit">시</span>
            <input id="schMinute" type="number" min="0" max="59" inputmode="numeric" />
            <span class="datetime-unit">분</span>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="schLocation">면접장소</label>
            <select id="schLocation">
              <option value="">면접장소를 선택하세요</option>
            </select>
          </div>
          <div class="field">
            <label for="schTeam">팀</label>
            <select id="schTeam">
              <option value="">팀을 선택하세요</option>
            </select>
          </div>
          <div class="field">
            <label for="schInterviewer">면접진행자</label>
            <select id="schInterviewer">
              <option value="">면접진행자를 선택하세요</option>
            </select>
          </div>
          <div class="field">
            <label for="schRound">구분</label>
            <select id="schRound">
              <option value="">구분을 선택하세요</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="schNote">비고 (선택)</label>
          <input id="schNote" type="text" autocomplete="off" />
        </div>
        <button id="addScheduleBtn" class="send-btn">일정 등록</button>
        <p class="status" id="scheduleStatus"></p>
      </section>

      <section class="panel schedule-list-panel">
        <div class="preview-head">
          <span class="preview-label">면접 일정 목록</span>
        </div>

        <div class="schedule-filters">
          <select id="scheduleTeamFilter">
            <option value="">전체 팀</option>
          </select>
          <select id="scheduleRoundFilter">
            <option value="">전체구분</option>
          </select>
          <select id="schedulePeriodFilter">
            <option value="all">전체날짜</option>
            <option value="day">1일</option>
            <option value="week">1주일</option>
            <option value="month">1개월</option>
            <option value="3month">3개월</option>
          </select>
          <input id="scheduleNameSearch" type="text" placeholder="이름으로 검색" autocomplete="off" />
          <button id="scheduleFilterResetBtn" class="filter-reset-btn">선택 초기화</button>
        </div>

        <table class="history-table">
          <thead>
            <tr>
              <th>일시</th>
              <th>이름</th>
              <th>연락처</th>
              <th>구분</th>
              <th>팀</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="scheduleListBody">
            <tr><td colspan="6" class="empty-row">등록된 일정이 없습니다.</td></tr>
          </tbody>
        </table>

        <div id="scheduleDetail"></div>
      </section>

      <section class="panel schedule-overview-panel">
        <div class="preview-head">
          <span class="preview-label" id="scheduleOverviewTitle">오늘의 면접</span>
        </div>
        <div id="scheduleOverview" class="schedule-overview"></div>
      </section>
    </div>
    </div>

    <div id="manageView" class="manage-view" hidden>
      <div class="manage-toolbar">
        <button id="addTemplateBtn" class="add-btn">+ 새 양식 추가</button>
      </div>
      <div class="field">
        <label for="templateManageSelect">조회할 양식</label>
        <select id="templateManageSelect">
          <option value="">양식을 선택하세요</option>
        </select>
      </div>
      <div id="templateDetail"></div>
    </div>
  </div>

  <template id="templateCardTpl">
    <div class="tpl-card">
      <div class="tpl-card-head">
        <h3 class="tpl-label-view"></h3>
        <input class="tpl-label-input" type="text" placeholder="양식 이름 (예: 팀장면접_강남)" hidden />
        <div class="tpl-card-actions">
          <button class="tpl-edit-btn">수정</button>
          <button class="tpl-save-btn" hidden>저장</button>
          <button class="tpl-cancel-btn" hidden>취소</button>
          <button class="tpl-delete-btn">삭제</button>
        </div>
      </div>
      <pre class="tpl-body-view"></pre>
      <textarea class="tpl-body-input" rows="10" placeholder="문자 본문을 입력하세요. 지원자 이름은 {{name}}, 면접일정은 {{date}} 로 표시합니다." hidden></textarea>
      <p class="tpl-status"></p>
    </div>
  </template>

  <template id="scheduleCardTpl">
    <div class="tpl-card">
      <div class="tpl-card-head">
        <h3 class="sch-name-view"></h3>
        <div class="tpl-card-actions">
          <button class="sch-calendar-btn">구글캘린더에 추가</button>
          <button class="sch-edit-btn">수정</button>
          <button class="sch-save-btn" hidden>저장</button>
          <button class="sch-cancel-btn" hidden>취소</button>
          <button class="sch-delete-btn">삭제</button>
        </div>
      </div>

      <div class="sch-detail-view">
        <div class="sch-detail-row"><span class="sch-detail-label">연락처</span><span class="sch-phone-view"></span></div>
        <div class="sch-detail-row"><span class="sch-detail-label">면접일시</span><span class="sch-date-view"></span></div>
        <div class="sch-detail-row"><span class="sch-detail-label">면접장소</span><span class="sch-location-view"></span></div>
        <div class="sch-detail-row"><span class="sch-detail-label">팀</span><span class="sch-team-view"></span></div>
        <div class="sch-detail-row"><span class="sch-detail-label">면접진행자</span><span class="sch-interviewer-view"></span></div>
        <div class="sch-detail-row"><span class="sch-detail-label">구분</span><span class="sch-round-view"></span></div>
        <div class="sch-detail-row"><span class="sch-detail-label">비고</span><span class="sch-note-view"></span></div>
      </div>

      <div class="sch-detail-edit" hidden>
        <div class="field">
          <label>연락처</label>
          <input class="sch-phone-input" type="tel" />
        </div>
        <div class="field">
          <label>면접일시</label>
          <div class="datetime-group">
            <select class="sch-year-input"></select>
            <select class="sch-month-input"></select>
            <select class="sch-day-input"></select>
            <input class="sch-hour-input" type="number" min="0" max="23" inputmode="numeric" />
            <span class="datetime-unit">시</span>
            <input class="sch-minute-input" type="number" min="0" max="59" inputmode="numeric" />
            <span class="datetime-unit">분</span>
          </div>
        </div>
        <div class="field">
          <label>면접장소</label>
          <select class="sch-location-input"></select>
        </div>
        <div class="field">
          <label>팀</label>
          <select class="sch-team-input"></select>
        </div>
        <div class="field">
          <label>면접진행자</label>
          <select class="sch-interviewer-input"></select>
        </div>
        <div class="field">
          <label>구분</label>
          <select class="sch-round-input"></select>
        </div>
        <div class="field">
          <label>비고</label>
          <input class="sch-note-input" type="text" />
        </div>
      </div>
      <p class="tpl-status sch-status-msg"></p>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
